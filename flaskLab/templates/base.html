<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}College Portal{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1>College Portal</h1>

            <nav>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('courses') }}">Courses</a>
                <a href="{{ url_for('faculty') }}">Faculty</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 College Portal. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
