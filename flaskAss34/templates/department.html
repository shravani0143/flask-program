{% extends "base.html" %}

{% block title %}
Departments - Employee Management System
{% endblock %}

{% block content %}

<h2 class="page-title">Departments</h2>

<div class="department-grid">

    {% for department in departments %}

    <div class="department-card">

        <h3>{{ department }}</h3>

        <p>
            Department of {{ department }}
        </p>

    </div>

    {% endfor %}

</div>

{% endblock %}
