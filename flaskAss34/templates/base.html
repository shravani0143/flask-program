<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Employee Management System
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="container">
            <h1>Employee Management System</h1>

            <nav>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('employee_list') }}">Employees</a>
                <a href="{{ url_for('department') }}">Departments</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Employee Management System</p>
    </footer>

</body>
</html>
